name: 自动部署（工业资讯简报）

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-industry-briefing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: SSH 远程部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 110m
          capture_stdout: false
          script: |
            set -euo pipefail

            echo "========== 开始部署 智能仓储每日简讯 =========="

            PROJECT_DIR="/opt/industry_briefing/daily_industry_briefing"
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "错误：部署目录不存在或不是 Git 仓库：$PROJECT_DIR"
              exit 1
            fi

            cd "$PROJECT_DIR"

            echo ">>> 步骤 1/2: 同步代码到 origin/master..."
            git fetch --prune origin
            git checkout master
            git reset --hard origin/master

            echo ">>> 步骤 2/2: 构建并重启 Docker 容器..."
            docker compose down
            docker compose up -d --build --force-recreate --remove-orphans
            docker compose ps
            CONTAINER_ID="$(docker compose ps -q news)"
            if [ -z "$CONTAINER_ID" ]; then
              echo "错误：未找到 news 容器"
              docker compose logs news --tail 200 || true
              exit 1
            fi

            echo ">>> 健康检查: 等待容器进入 healthy 状态..."
            for i in $(seq 1 60); do
              STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_ID")"
              echo "第 ${i} 次检查: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                break
              fi

              if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                echo "错误：容器状态异常：$STATUS"
                docker compose logs news --tail 200 || true
                exit 1
              fi

              sleep 5
            done

            FINAL_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_ID")"
            if [ "$FINAL_STATUS" != "healthy" ]; then
              echo "错误：等待健康检查超时，最终状态：$FINAL_STATUS"
              docker compose logs news --tail 200 || true
              exit 1
            fi

            echo ">>> 健康检查: 验证宿主机端口可访问..."
            curl -fsS --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8088/api/status >/dev/null

            echo "========== 部署完成 =========="
