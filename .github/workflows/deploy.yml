name: 自动部署（工业资讯简报）

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-industry-briefing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: SSH 远程部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -euo pipefail

            echo "========== 开始部署 智能仓储每日简讯 =========="

            PROJECT_DIR="/opt/industry_briefing/daily_industry_briefing"
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "错误：部署目录不存在或不是 Git 仓库：$PROJECT_DIR"
              exit 1
            fi

            cd "$PROJECT_DIR"

            echo ">>> 步骤 1/2: 同步代码到 origin/master..."
            git fetch --prune origin
            git checkout master
            git reset --hard origin/master

            echo ">>> 步骤 2/2: 构建并重启 Docker 容器..."
            docker compose down
            docker compose up -d --build --force-recreate --remove-orphans

            echo "========== 部署完成 =========="