name: 自动部署（工业资讯简报）

on:
  push:
    branches:
      - master
      - codex/opportunity-tab-v1
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-industry-briefing-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    name: V2 离线回归与镜像验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 离线回归与编译检查
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q services tests scripts app.py fetch.py
          git diff --check
      - name: Compose 与镜像验证
        run: |
          docker compose -p industry_briefing --env-file .env.example config --quiet
          docker build -t industry-briefing:ci .
          docker run --rm --entrypoint python industry-briefing:ci scripts/check_opportunity_config.py
      - name: 隔离服务健康检查（无外网、无生产数据）
        run: |
          set -euo pipefail
          CID=$(docker run -d --network none -e FETCH_NEWS_ON_STARTUP=false -e OPPORTUNITY_ENABLED=false -e OPPORTUNITY_AUTO_PUBLISH=false industry-briefing:ci)
          trap 'docker rm -f "$CID" >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if docker exec "$CID" python -c "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:8088'+p, timeout=3).close() for p in ('/api/status','/api/opportunities/status','/api/opportunities/today')]"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master'
    name: 部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: SSH 远程部署到服务器
        uses: appleboy/ssh-action@v1
        env:
          TARGET_COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 110m
          capture_stdout: false
          envs: TARGET_COMMIT
          script: |
            set -euo pipefail

            echo "========== 开始部署 智能仓储每日简讯 =========="

            PROJECT_DIR="/opt/industry_briefing/daily_industry_briefing"
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "错误：部署目录不存在或不是 Git 仓库：$PROJECT_DIR"
              exit 1
            fi

            cd "$PROJECT_DIR"

            if [ ! -f /opt/industry_briefing/.env ]; then
              echo "错误：缺少服务器环境配置 /opt/industry_briefing/.env"
              exit 1
            fi

            # 部署本次已通过验证的提交，避免拉取到另一个尚未验证的 master HEAD。
            if [[ ! "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "错误：部署提交无效"
              exit 1
            fi

            echo ">>> 步骤 1/2: 同步代码到 origin/master..."
            git fetch --prune origin
            git merge-base --is-ancestor "$TARGET_COMMIT" origin/master
            git checkout master
            git reset --hard "$TARGET_COMMIT"

            echo ">>> 步骤 2/2: 构建并重启 Docker 容器..."
            docker compose --env-file /opt/industry_briefing/.env config --quiet
            docker compose --env-file /opt/industry_briefing/.env build
            docker compose --env-file /opt/industry_briefing/.env run --rm --no-deps news python scripts/check_opportunity_config.py
            docker compose --env-file /opt/industry_briefing/.env up -d --force-recreate --remove-orphans
            docker compose --env-file /opt/industry_briefing/.env ps
            CONTAINER_ID="$(docker compose --env-file /opt/industry_briefing/.env ps -q news)"
            if [ -z "$CONTAINER_ID" ]; then
              echo "错误：未找到 news 容器"
              docker compose --env-file /opt/industry_briefing/.env logs news --tail 200 || true
              exit 1
            fi

            echo ">>> 健康检查: 等待容器进入 healthy 状态..."
            for i in $(seq 1 60); do
              STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_ID")"
              echo "第 ${i} 次检查: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                break
              fi

              if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                echo "错误：容器状态异常：$STATUS"
                docker compose --env-file /opt/industry_briefing/.env logs news --tail 200 || true
                exit 1
              fi

              sleep 5
            done

            FINAL_STATUS="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_ID")"
            if [ "$FINAL_STATUS" != "healthy" ]; then
              echo "错误：等待健康检查超时，最终状态：$FINAL_STATUS"
              docker compose --env-file /opt/industry_briefing/.env logs news --tail 200 || true
              exit 1
            fi

            echo ">>> 健康检查: 验证宿主机端口可访问..."
            curl -fsS --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8088/api/status >/dev/null
            curl -fsS --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8088/api/opportunities/status >/dev/null
            curl -fsS --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8088/api/opportunities/today >/dev/null

            echo "========== 部署完成 =========="
