services:
  news:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        PIP_EXTRA_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
    ports:
      - "8088:8088"
    environment:
      - COOKIE_FILE_PATH=/runtime/cookie.txt
      - SITE_URL=https://mag.mhstar.tech
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - WECOM_MENTIONED_LIST=${WECOM_MENTIONED_LIST:-}
      - WECOM_MENTIONED_MOBILE_LIST=${WECOM_MENTIONED_MOBILE_LIST:-}
      - SERVERCHAN_KEY=${SERVERCHAN_KEY:-}
      - ALERT_COOLDOWN_HOURS=${ALERT_COOLDOWN_HOURS:-6}
      - RSS_AUTH_HEALTH_CHECK_INTERVAL_HOURS=${RSS_AUTH_HEALTH_CHECK_INTERVAL_HOURS:-8}
      - RSS_SILENCE_THRESHOLD_HOURS=${RSS_SILENCE_THRESHOLD_HOURS:-48}
    volumes:
      - ./output:/app/output
      # 将 cookie 文件放在源码目录上一层（宿主机），避免跟代码发布耦合
      - ../news_runtime:/runtime
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/status', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
