services:
  news:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        PIP_EXTRA_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
    ports:
      - "8088:8088"
    environment:
      - COOKIE_FILE_PATH=/runtime/cookie.txt
      - SITE_URL=${SITE_URL:-https://mag.mhstar.tech}
      - FETCH_NEWS_ON_STARTUP=${FETCH_NEWS_ON_STARTUP:-true}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - WECOM_MENTIONED_LIST=${WECOM_MENTIONED_LIST:-}
      - WECOM_MENTIONED_MOBILE_LIST=${WECOM_MENTIONED_MOBILE_LIST:-}
      - SERVERCHAN_KEY=${SERVERCHAN_KEY:-}
      - ALERT_COOLDOWN_HOURS=${ALERT_COOLDOWN_HOURS:-6}
      - RSS_AUTH_HEALTH_CHECK_INTERVAL_HOURS=${RSS_AUTH_HEALTH_CHECK_INTERVAL_HOURS:-8}
      - RSS_SILENCE_THRESHOLD_HOURS=${RSS_SILENCE_THRESHOLD_HOURS:-48}
      - RSS_KEYWORD_HEALTHY_MIN_ARTICLES=${RSS_KEYWORD_HEALTHY_MIN_ARTICLES:-5}
      - WERSS_TOKEN_EXPIRY_URL=${WERSS_TOKEN_EXPIRY_URL:-}
      - WERSS_TOKEN_EXPIRY_AUTHORIZATION=${WERSS_TOKEN_EXPIRY_AUTHORIZATION:-}
      - WERSS_TOKEN_WARNING_HOURS=${WERSS_TOKEN_WARNING_HOURS:-12,3}
      - OPPORTUNITY_ENABLED=${OPPORTUNITY_ENABLED:-true}
      - OPPORTUNITY_AI_ENABLED=${OPPORTUNITY_AI_ENABLED:-true}
      - OPPORTUNITY_AUTO_PUBLISH=${OPPORTUNITY_AUTO_PUBLISH:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPPORTUNITY_FALLBACK_PROVIDER=${OPPORTUNITY_FALLBACK_PROVIDER:-}
      - OPPORTUNITY_SEARCH_PROVIDER=${OPPORTUNITY_SEARCH_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_OPPORTUNITY_MODEL=${OPENAI_OPPORTUNITY_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_OPPORTUNITY_MODEL=${GLM_OPPORTUNITY_MODEL:-}
      - GLM_BASE_URL=${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - GLM_WEB_SEARCH_ENABLED=${GLM_WEB_SEARCH_ENABLED:-${GLM_NATIVE_WEB_SEARCH:-false}}
      - OPPORTUNITY_AI_REASONING=${OPPORTUNITY_AI_REASONING-medium}
      - OPPORTUNITY_AI_RESEARCH_LIMIT=${OPPORTUNITY_AI_RESEARCH_LIMIT:-12}
      - OPPORTUNITY_RESEARCH_WAVE_SIZE=${OPPORTUNITY_RESEARCH_WAVE_SIZE:-6}
      - OPPORTUNITY_RESEARCH_HARD_LIMIT=${OPPORTUNITY_RESEARCH_HARD_LIMIT:-18}
      - OPPORTUNITY_VERIFIED_TARGET=${OPPORTUNITY_VERIFIED_TARGET:-5}
      - OPPORTUNITY_TRIAGE_ENABLED=${OPPORTUNITY_TRIAGE_ENABLED:-true}
      - OPPORTUNITY_RESOLVER_MAX_SEARCHES=${OPPORTUNITY_RESOLVER_MAX_SEARCHES:-3}
      - OPPORTUNITY_RESOLVER_MIN_SCORE=${OPPORTUNITY_RESOLVER_MIN_SCORE:-75}
      - OPPORTUNITY_CANDIDATE_LIMIT=${OPPORTUNITY_CANDIDATE_LIMIT:-60}
      - OPPORTUNITY_DIGEST_LIMIT=${OPPORTUNITY_DIGEST_LIMIT:-5}
      - OPPORTUNITY_DISPLAY_LIMIT=${OPPORTUNITY_DISPLAY_LIMIT:-10}
      - OPPORTUNITY_AI_CONCURRENCY=${OPPORTUNITY_AI_CONCURRENCY:-2}
      - OPPORTUNITY_SEARCH_CONCURRENCY=${OPPORTUNITY_SEARCH_CONCURRENCY:-1}
      - OPPORTUNITY_TASK_TIMEOUT=${OPPORTUNITY_TASK_TIMEOUT:-1200}
      - OPPORTUNITY_AI_REQUEST_TIMEOUT=${OPPORTUNITY_AI_REQUEST_TIMEOUT:-180}
      - OPENAI_OPPORTUNITY_MAX_TOOL_CALLS=${OPENAI_OPPORTUNITY_MAX_TOOL_CALLS:-12}
      - OPPORTUNITY_DISCOVERY_SEARCH_BUDGET=${OPPORTUNITY_DISCOVERY_SEARCH_BUDGET:-12}
      - OPPORTUNITY_VERIFY_SEARCH_BUDGET=${OPPORTUNITY_VERIFY_SEARCH_BUDGET:-24}
      - OPPORTUNITY_TOTAL_SEARCH_BUDGET=${OPPORTUNITY_TOTAL_SEARCH_BUDGET:-${OPENAI_OPPORTUNITY_MAX_TOOL_CALLS:-36}}
      - OPPORTUNITY_MEMORY_RECHECK_HOURS=${OPPORTUNITY_MEMORY_RECHECK_HOURS:-24}
      - OPENAI_OPPORTUNITY_MAX_OUTPUT_TOKENS=${OPENAI_OPPORTUNITY_MAX_OUTPUT_TOKENS:-8000}
      - OPPORTUNITY_MAX_LLM_CALLS=${OPPORTUNITY_MAX_LLM_CALLS:-64}
      - WECOM_OPPORTUNITY_WEBHOOK_URL=${WECOM_OPPORTUNITY_WEBHOOK_URL:-}
      - OPPORTUNITY_PUBLISH_ATTEMPTS=${OPPORTUNITY_PUBLISH_ATTEMPTS:-3}
      - OPPORTUNITY_PUBLISH_RETRY_SECONDS=${OPPORTUNITY_PUBLISH_RETRY_SECONDS:-600}
      - OPPORTUNITY_RUNTIME_DIR=/runtime
      - OPPORTUNITY_INPUT_COST_PER_MILLION=${OPPORTUNITY_INPUT_COST_PER_MILLION:-}
      - OPPORTUNITY_OUTPUT_COST_PER_MILLION=${OPPORTUNITY_OUTPUT_COST_PER_MILLION:-}
      - OPPORTUNITY_SEARCH_COST_PER_THOUSAND=${OPPORTUNITY_SEARCH_COST_PER_THOUSAND:-}
    volumes:
      - ./output:/app/output
      # 将 cookie 文件放在源码目录上一层（宿主机），避免跟代码发布耦合
      - ../news_runtime:/runtime
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:8088' + path, timeout=3).close() for path in ('/api/status', '/api/opportunities/status')]"
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
